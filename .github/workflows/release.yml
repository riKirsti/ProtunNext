name: Publish source release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified source release
        type: boolean
        default: false
permissions: {}
concurrency:
  group: publish-source-release
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      upstream: ${{ steps.verify.outputs.upstream }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: '1.100.0'
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          upstream=$(python -c 'import json; print(json.load(open("tests/fixtures/compatibility.json"))["upstream"]["commit"])')
          [[ "$upstream" =~ ^[0-9a-f]{40}$ ]]
          for workflow in ci.yml security.yml; do
            result=$(gh run list --workflow "$workflow" --branch main --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion')
            test "$result" = success
          done
          python scripts/check_repository.py
          python scripts/verify-vendor.py
          python scripts/compatibility.py --verify-tag
          python -m unittest discover -s scripts -p 'test_compatibility.py'
          cargo run --locked -- verify-code-parity
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'upstream=%s\n' "$upstream" >> "$GITHUB_OUTPUT"
  publish:
    needs: qualify
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.qualify.outputs.version }}
          UPSTREAM: ${{ needs.qualify.outputs.upstream }}
        run: |
          set -euo pipefail
          git_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$git_main" = "$GITHUB_SHA"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists."
            exit 1
          fi
          ref="refs/tags/v$VERSION"
          tags=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "$ref" "$ref^{}")
          if [[ -z "$tags" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="$ref" -f sha="$GITHUB_SHA" --silent
            tags=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "$ref" "$ref^{}")
          fi
          tag_sha=$(awk 'END { print $1 }' <<< "$tags")
          test "$tag_sha" = "$GITHUB_SHA"
          cat > release-notes.md <<EOF
          ProtunNext $VERSION is an independent runtime based on the
          [ProtonVPN Protun compatibility baseline](https://github.com/ProtonVPN/protun/tree/$UPSTREAM).

          The source archives contain the qualified commit $GITHUB_SHA.
          See the repository's build and deployment guides for supported targets.
          Live service and native-device deployment qualifications are tracked
          separately in the requirements ledger.
          EOF
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ProtunNext $VERSION" --notes-file release-notes.md
