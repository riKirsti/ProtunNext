name: Qualify maintenance candidates
on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      retry:
        type: boolean
        default: false
permissions: {contents: read}
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      VALIDATION_PLATFORM: ${{ matrix.platform }}
      QUALIFICATION_RETRY: ${{ inputs.retry }}
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintenance-proposals
          path: ${{ runner.temp }}/maintenance-proposals/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.retry
        with:
          name: maintenance-first-${{ matrix.platform }}
          path: ${{ runner.temp }}/maintenance-first-results/
      - run: python scripts/maintenance.py qualify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-${{ inputs.retry && 'retry' || 'first' }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/maintenance-results/
          if-no-files-found: error
          retention-days: 7
