name: Qualify maintenance candidates
on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      retry:
        type: boolean
        default: false
permissions: {contents: read}
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      VALIDATION_PLATFORM: ${{ matrix.platform }}
      QUALIFICATION_RETRY: ${{ inputs.retry }}
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-proposals
          path: ${{ runner.temp }}/maintenance-proposals/
      - uses: actions/download-artifact@v4
        if: inputs.retry
        with:
          name: maintenance-first-${{ matrix.platform }}
          path: ${{ runner.temp }}/maintenance-first-results/
      - run: python scripts/maintenance.py qualify
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-${{ inputs.retry && 'retry' || 'first' }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/maintenance-results/
          if-no-files-found: error
          retention-days: 7
