name: security-erasure
on:
  push:
    branches: [main]
    paths: ['scripts/security/**', 'examples/erasure_codegen.rs', '.github/workflows/security.yml', 'src/packet.rs', 'src/tls_unbuffered.rs', 'Cargo.toml', 'Cargo.lock']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: erasure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: '1.100.0'
      - name: Validate linked erasure checker regressions
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py' -v
      - name: Test packet erasure and build normal thin-LTO release fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/erasure-codegen
          { rustc -vV; cargo -vV; uname -a; printf 'profile=release thin-LTO codegen-units=1 panic=abort\nRUSTFLAGS=%s\n' "${RUSTFLAGS-}"; } > target/erasure-codegen/environment.txt
          cargo test --locked --release --no-default-features --features unix --lib > target/erasure-codegen/tests.log 2>&1
          cargo build --locked --release --no-default-features --features unix --example erasure_codegen > target/erasure-codegen/build.log 2>&1
          target/release/examples/erasure_codegen K
          sha256sum target/release/examples/erasure_codegen > target/erasure-codegen/binary.sha256
          objdump -Cd --no-show-raw-insn target/release/examples/erasure_codegen > target/erasure-codegen/disassembly.txt
          objdump -R target/release/examples/erasure_codegen >> target/erasure-codegen/disassembly.txt
          python3 scripts/security/check_codegen.py target/erasure-codegen/disassembly.txt | tee target/erasure-codegen/check.txt
      - name: Reject a real wipe-free Drop binary as a negative control
        run: python3 scripts/security/negative_control.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: erasure-codegen-${{ matrix.os }}
          path: target/erasure-codegen/
