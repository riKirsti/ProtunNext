name: packet-erasure-release-verification
on:
  push:
    branches: [performance/worker-next]
    paths: ['experiments/audit/**', 'examples/erasure_codegen.rs', '.github/workflows/performance-audit.yml', 'src/packet.rs']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Validate analyzer failure and inconclusive classifications
        run: python3 -m unittest discover -s experiments/audit -p 'test_*.py' -v
      - name: Test packet erasure and build normal thin-LTO release fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/erasure-codegen
          { rustc -vV; cargo -vV; uname -a; printf 'profile=release thin-LTO codegen-units=1 panic=abort\nRUSTFLAGS=%s\n' "${RUSTFLAGS-}"; } > target/erasure-codegen/environment.txt
          cargo test --locked --release --no-default-features --features unix --lib packet::tests > target/erasure-codegen/tests.log 2>&1
          cargo build --locked --release --no-default-features --features unix --example erasure_codegen > target/erasure-codegen/build.log 2>&1
          target/release/examples/erasure_codegen K
          sha256sum target/release/examples/erasure_codegen > target/erasure-codegen/binary.sha256
          objdump -Cd --no-show-raw-insn target/release/examples/erasure_codegen > target/erasure-codegen/disassembly.txt
          python3 experiments/audit/check_codegen.py target/erasure-codegen/disassembly.txt | tee target/erasure-codegen/check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erasure-codegen-${{ matrix.os }}
          path: target/erasure-codegen/
