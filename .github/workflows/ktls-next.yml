name: ktls-next-functional-probe
on:
  push:
    branches: [performance/worker-next]
    paths: ['experiments/ktls/**', '.github/workflows/ktls-next.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, ubuntu-24.04-arm]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --manifest-path experiments/ktls/Cargo.toml
      - name: Exercise native kTLS
        run: |
          mkdir -p target/ktls-results
          uname -a >target/ktls-results/kernel.txt
          sudo unshare --net sh -c 'ip link set lo up; experiments/ktls/target/release/ktls-next-probe tls12' | tee target/ktls-results/tls12.log
          sudo unshare --net sh -c 'ip link set lo up; experiments/ktls/target/release/ktls-next-probe tls13' | tee target/ktls-results/tls13.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ktls-native-${{ matrix.os }}
          path: target/ktls-results/
  lts:
    strategy:
      fail-fast: false
      matrix: {kernel: ['6.12.115','6.18.60']}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: x86_64-unknown-linux-musl}
      - uses: actions/cache/restore@v4
        id: kernel-cache
        with:
          path: target/ktls-kernels/${{ matrix.kernel }}/
          key: ktls-next-${{ matrix.kernel }}-${{ hashFiles('experiments/ktls/lts.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 busybox-static musl-tools flex bison libelf-dev libssl-dev bc cpio
      - run: bash experiments/ktls/lts.sh '${{ matrix.kernel }}'
      - uses: actions/cache/save@v4
        if: always() && steps.kernel-cache.outputs.cache-hit != 'true' && hashFiles('target/ktls-kernels/**/bzImage') != ''
        with:
          path: target/ktls-kernels/${{ matrix.kernel }}/
          key: ktls-next-${{ matrix.kernel }}-${{ hashFiles('experiments/ktls/lts.sh') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ktls-lts-${{ matrix.kernel }}
          path: target/ktls-results/
