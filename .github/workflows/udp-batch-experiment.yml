name: native-download-validation
on:
  pull_request:
    paths:
      - src/linux_batch.rs
      - experiments/download/**
      - experiments/audit/**
      - experiments/build/**
      - .github/workflows/udp-batch-experiment.yml
  workflow_dispatch:
    inputs:
      build_mode:
        type: choice
        default: release
        options: [release, pgo, cpu, accept-paced, accept-capacity, accept-delay]
        description: Independent build or Stage 7 same-host factors; fixed portable helpers
      tls_records:
        type: boolean
        default: false
        description: Build archive-only Stage 5 TLS record prototype (NoLocalAgent experiment)
      screen_crypto:
        type: boolean
        default: false
        description: Run isolated Stage 5 crypto preselection on native x64 and ARM64
      baseline:
        type: string
        default: f3e7502217153bad5decc8ef700f5afee6d0652e
        description: Immutable 40-character baseline commit (merged PR 5)
      run_downloads:
        type: boolean
        default: false
        description: Also run full normal-release download campaigns
      rate_bps:
        type: string
        default: '0'
        description: Optional aggregate test rate in bits/s (0 = unpaced; paced samples use 128 MiB)
      block:
        type: string
        default: ''
        description: Optional workload block for a focused comparison
      tun_mode:
        type: choice
        default: raw
        options: [raw, compare, vnet]
        description: Raw control or raw baseline versus negotiated receive coalescing
      client_cores:
        type: choice
        default: '1'
        options: ['1', '2']
        description: Same allowed client CPUs for baseline and candidate
      parallel_receive:
        type: boolean
        default: false
        description: Build archived Stage 4 prototype and require parallel authentication (two client CPUs)
permissions: {contents: read}
defaults:
  run:
    shell: bash
env:
  BASELINE: ${{ inputs.baseline || 'f3e7502217153bad5decc8ef700f5afee6d0652e' }}
  NEXT_RECEIVE_PROTOTYPE: ${{ inputs.parallel_receive && '1' || '0' }}
  NEXT_TLS_RECORD_PROTOTYPE: ${{ inputs.tls_records && '1' || '0' }}
  NEXT_BUILD_MODE: ${{ inputs.build_mode || 'release' }}
concurrency:
  group: udp-batch-${{ github.ref }}-${{ inputs.tun_mode }}-${{ inputs.rate_bps }}-${{ inputs.block }}-${{ inputs.client_cores }}-${{ inputs.parallel_receive }}-${{ inputs.tls_records }}-${{ inputs.screen_crypto }}-${{ inputs.build_mode }}
  cancel-in-progress: true
jobs:
  crypto-screen:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.screen_crypto }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Verify independent AEAD implementations
        run: |
          cargo test --locked --release --manifest-path experiments/crypto/Cargo.toml
          cargo build --locked --release --manifest-path experiments/crypto/Cargo.toml
      - name: Screen balanced synthetic packet operations on one allowed CPU
        run: python3 experiments/crypto/screen.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-screen-${{ matrix.os }}
          path: target/crypto-screen/
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Validate analyzers and injected socket regressions
        run: |
          [[ "$BASELINE" =~ ^[0-9a-f]{40}$ ]]
          python3 -m unittest discover -s experiments/download -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/audit -p 'test_*.py' -v
          python3 experiments/audit/prepare.py --baseline "$BASELINE"
          source=$(python3 -c "import json; print(json.load(open('target/erasure-audit/builds.json'))['erase']['path'])")
          cargo test --locked --lib --no-default-features --features unix --manifest-path "$source/Cargo.toml" 2>&1 | tee target/erasure-audit/probe-regressions.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-checks-${{ matrix.os }}
          path: |
            target/erasure-audit/builds.json
            target/erasure-audit/probe-regressions.log
  download:
    needs: checks
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_downloads }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Validate comparison analyzers
        run: |
          python3 -m unittest discover -s experiments/download -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/audit -p 'test_*.py' -v
      - name: Build candidate and fixed baseline auxiliaries
        run: |
          if [[ "$NEXT_BUILD_MODE" = pgo || "$NEXT_BUILD_MODE" = accept-* ]]; then rustup component add llvm-tools-preview; fi
          if [[ "$NEXT_BUILD_MODE" = accept-* ]]; then
            python3 experiments/build/accept.py "${NEXT_BUILD_MODE#accept-}"
          else
            bash experiments/audit/build.sh "$(rustc -vV | sed -n 's/^host: //p')"
          fi
      - name: Compare verified downloads across all transports
        if: ${{ !startsWith(inputs.build_mode, 'accept-') }}
        env:
          NEXT_DOWNLOAD_RATE_BPS: ${{ inputs.rate_bps || '0' }}
          NEXT_DOWNLOAD_BLOCK: ${{ inputs.block }}
          NEXT_DOWNLOAD_TUN_MODE: ${{ inputs.tun_mode || 'raw' }}
          NEXT_DOWNLOAD_CLIENT_CORES: ${{ inputs.client_cores || '1' }}
          NEXT_DOWNLOAD_PARALLEL: ${{ inputs.parallel_receive && '1' || '0' }}
        run: sudo env "NEXT_BUILD_MODE=$NEXT_BUILD_MODE" "NEXT_DOWNLOAD_RATE_BPS=$NEXT_DOWNLOAD_RATE_BPS" "NEXT_DOWNLOAD_BLOCK=$NEXT_DOWNLOAD_BLOCK" "NEXT_DOWNLOAD_TUN_MODE=$NEXT_DOWNLOAD_TUN_MODE" "NEXT_DOWNLOAD_CLIENT_CORES=$NEXT_DOWNLOAD_CLIENT_CORES" "NEXT_DOWNLOAD_PARALLEL=$NEXT_DOWNLOAD_PARALLEL" python3 experiments/audit/native.py --download
      - name: Retain raw results even on failure
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" target/erasure-audit
          file=target/erasure-audit/results/native/download/summary.md
          if [ -f "$file" ]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udp-batch-${{ matrix.os }}
          path: |
            target/erasure-audit/results/
            target/erasure-audit/builds.json
            target/erasure-audit/toolchain.txt
            target/erasure-audit/*.log
            target/erasure-audit/pgo-*/
            target/erasure-audit/*disassembly.txt
            target/erasure-audit/bin/
            target/erasure-audit/matrix/
