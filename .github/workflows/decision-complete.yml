name: one-hour-final-controls
on:
  push:
    branches: ['experiments/decision-hour-*']
permissions: { contents: read }
jobs:
  components:
    if: contains(github.event.head_commit.message, 'components-final')
    strategy:
      fail-fast: false
      matrix:
        kernel: ['6.12.115','6.18.60']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - uses: actions/cache/restore@v4
        with:
          path: target/lts-kernels/${{ matrix.kernel }}/
          key: decision-kernel-v2-${{ matrix.kernel }}-${{ hashFiles('experiments/decision/kernel-options.txt') }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 busybox-static musl-tools cpio flex bison libelf-dev libssl-dev bc
      - run: |
          python3 experiments/decision/prepare.py
          bash experiments/decision/lts.sh '${{ matrix.kernel }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hour-final-components-${{ matrix.kernel }}
          path: results/
  native-pgo:
    if: contains(github.event.head_commit.message, 'controls-fix')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04,ubuntu-24.04-arm]
        replicate: [1,2,3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - run: |
          python3 experiments/decision/prepare.py
          mkdir -p results
          uname -a > results/environment.txt
          lscpu >> results/environment.txt
          cargo build --manifest-path reference/Cargo.toml --release --no-default-features --features in-place-crypto,io-uring --bin decision --target-dir bench-target
          bench-target/release/decision --parallel > results/shared-session-parallel.log 2>&1
          status=0
          bash experiments/decision/pgo.sh || status=1
          bash experiments/decision/correctness.sh baseline || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hour-pgo-${{ matrix.os }}-${{ matrix.replicate }}
          path: results/
