name: Axiomatic lifecycle router evidence
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact commit containing the lifecycle fixture
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ inputs.source }}
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: '1.100.0'
          targets: aarch64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build standalone ARM64-musl fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo test --locked --release --all-features --target aarch64-unknown-linux-musl --test api_connection --test linux_tun --no-run --message-format=json > build.jsonl
          mkdir evidence
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          wanted = {"api_connection", "linux_tun"}
          for line in Path("build.jsonl").read_text().splitlines():
              row = json.loads(line)
              name = row.get("target", {}).get("name")
              if name in wanted and row.get("executable"):
                  shutil.copy2(row["executable"], Path("evidence") / name)
                  wanted.remove(name)
          assert not wanted, wanted
          PY
          strip evidence/api_connection evidence/linux_tun
          evidence/api_connection managed_capture_lifecycle_timing --exact --nocapture | tee evidence/github-lifecycle.log
          printf '%s\n' "$SOURCE_SHA" > evidence/source.txt
          (cd evidence; sha256sum api_connection linux_tun > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: router-lifecycle-arm64-musl
          path: evidence/
          if-no-files-found: error
          retention-days: 7
