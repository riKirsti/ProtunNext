name: Capture writer forwarding non-regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-paired:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      BASELINE_SHA: 1c2d24024c80b3836822e7a8d6d86a10a52a4976
      CANDIDATE_SHA: 2328144ac6a3aaf2999a102a9d941b83947eebcb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: '1.100.0'
      - name: Prepare exact source revisions and the isolated Linux fixture
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" "$CANDIDATE_SHA"
          git worktree add --detach "$RUNNER_TEMP/baseline" "$BASELINE_SHA"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$CANDIDATE_SHA"
          cmp "$RUNNER_TEMP/baseline/Cargo.lock" "$RUNNER_TEMP/candidate/Cargo.lock"
          cd "$RUNNER_TEMP/baseline"
          bash scripts/setup-benchmark-sandbox.sh
          cargo fetch --locked
      - name: Compare sustained UDP, TCP, and Stealth downloads
        working-directory: ${{ runner.temp }}/baseline
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          import maintenance

          root = Path(os.environ["RUNNER_TEMP"])
          baseline = maintenance.download.build(root / "baseline", root / "baseline-target")
          candidate = maintenance.download.build(root / "candidate", root / "candidate-target")
          report = {
              "baseline": os.environ["BASELINE_SHA"],
              "candidate": os.environ["CANDIDATE_SHA"],
              "architecture": platform.machine(),
              "workloads": {},
          }
          path = root / "capture-writer-paired.json"
          for workload in sorted(maintenance.DOWNLOAD_WORKLOADS):
              report["workloads"].update(maintenance.measure_tunnels(baseline, candidate, {workload}))
              path.write_text(json.dumps(report, indent=2), encoding="utf-8")
              row = report["workloads"][workload]
              print(workload, "sample quality:", row["sample_quality_passed"],
                    {key: value["decision"] for key, value in row["metrics"].items()}, flush=True)
          decision = maintenance.measurement_decision({"metrics": {}}, report["workloads"])
          report["decision"] = decision
          path.write_text(json.dumps(report, indent=2), encoding="utf-8")
          print("Overall paired download decision:", decision, flush=True)
          raise SystemExit(0 if decision == "passed" else 1)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: capture-writer-paired-${{ matrix.runner }}
          path: ${{ runner.temp }}/capture-writer-paired.json
          if-no-files-found: warn
          retention-days: 14
