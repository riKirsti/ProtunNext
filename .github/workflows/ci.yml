name: Managed healthy capture forwarding
on: workflow_dispatch
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      BASELINE: 65d255c15434ec4795ead96f83e29209652dd1bd
      CANDIDATE: 64061462c218de39175a80ad0457a3de08feacf4
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: '1.100.0'
          targets: aarch64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the two production revisions with the same temporary TUN fixture
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/healthy-capture"
          mkdir "$evidence"
          for label in baseline candidate; do
            sha="$BASELINE"
            if [[ "$label" == candidate ]]; then sha="$CANDIDATE"; fi
            source="$RUNNER_TEMP/$label"
            git worktree add --detach "$source" "$sha"
            (
              cd "$source"
              python "$GITHUB_WORKSPACE/scripts/overlay-healthy-capture-measurement.py"
              cargo test --locked --release --all-features --target aarch64-unknown-linux-musl --target-dir "$RUNNER_TEMP/shared-target" --test linux_tun --no-run --message-format=json > "$evidence/build.jsonl"
            )
            binary="$(jq -r 'select(.target.name == "linux_tun" and .executable != null) | .executable' "$evidence/build.jsonl")"
            install -m 755 "$binary" "$evidence/$label-linux_tun"
          done
          rm "$evidence/build.jsonl"
          cd "$evidence"
          strip baseline-linux_tun candidate-linux_tun
          sha256sum baseline-linux_tun candidate-linux_tun > SHA256SUMS
          printf '%s\n%s\n' "$BASELINE" "$CANDIDATE" > sources.txt
      - name: Run the paired healthy capture workload in disposable namespaces
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/healthy-capture"
          sample() {
            printf 'TRIAL %s %s %s\n' "$1" "$2" "$3"
            sudo unshare --net env PROTUN_NEXT_NETNS_TEST=1 PROTUNNEXT_HEALTHY_CAPTURE_MEASUREMENT=1 "./$3-linux_tun" tracked_customer_reply_outside_virtual_subnet_survives_the_real_tun_pipeline --ignored --exact --nocapture
          }
          {
            for pair in 1 2 3 4; do
              sample AA "$pair" baseline
              sample AA "$pair" baseline
              sample AB "$((2 * pair - 1))" baseline
              sample AB "$((2 * pair - 1))" candidate
              sample AB "$((2 * pair))" candidate
              sample AB "$((2 * pair))" baseline
            done
          } | tee github-healthy-capture.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: healthy-capture-arm64-musl
          path: ${{ runner.temp }}/healthy-capture/
          if-no-files-found: error
          retention-days: 14
