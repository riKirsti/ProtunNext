name: verification
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Assert incomplete parity cannot be reported as release-ready
        shell: bash
        run: |
          if cargo run --locked -- verify-parity; then
            echo "Unexpected parity approval; review this gate before releasing"
            exit 1
          fi
      - name: Build optimized runtime library and CLI
        run: cargo build --locked --release --lib --bin protun-next-cli
      - name: Call the native compatibility API through generated bindings
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run --locked --features bindgen --bin uniffi-bindgen -- generate --library target/release/libprotun_next.so --language python --out-dir target/generated --no-format
          cp target/release/libprotun_next.so target/generated/
          python3 tests/ffi_contract.py target/generated
      - name: Generate and typecheck Swift and Kotlin contracts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo run --locked --features bindgen --bin uniffi-bindgen -- generate --library target/release/libprotun_next.dylib --language swift --language kotlin --config uniffi.toml --out-dir target/generated --no-format
          swiftc -typecheck target/generated/ProtunNext.swift -I target/generated -Xcc -fmodule-map-file=target/generated/ProtunNextFFI.modulemap
      - name: Call Windows native initialization through generated bindings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo run --locked --features bindgen --bin uniffi-bindgen -- generate --library target/release/protun_next.dll --language python --out-dir target/windows-bindings --no-format
          cp target/release/protun_next.dll target/windows-bindings/
          python tests/windows_ffi_contract.py target/windows-bindings
      - name: Package verified Wintun driver without loading or installing it
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-development-package
          path: target/windows-package/
  android-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Compile native Android library for the upstream minimum API level
        shell: bash
        run: |
          toolchain="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android25-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo build --locked --release --lib --features android --target aarch64-linux-android
      - name: Generate Kotlin bindings from the actual Android library
        shell: bash
        run: |
          cargo run --locked --features bindgen --bin uniffi-bindgen -- generate --library target/aarch64-linux-android/release/libprotun_next.so --language kotlin --config uniffi.toml --out-dir target/android-bindings --no-format
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile Android service, bindings, unit tests and AAR
        shell: bash
        run: |
          mkdir -p target/android-jni/arm64-v8a
          cp target/aarch64-linux-android/release/libprotun_next.so target/android-jni/arm64-v8a/
          gradle -p android --no-daemon testDebugUnitTest assembleRelease
          bash -n scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-development-library-and-bindings
          path: |
            target/aarch64-linux-android/release/libprotun_next.so
            target/android-bindings/
            android/build/outputs/aar/
  linux-tun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build opt-in network integration test
        shell: bash
        run: |
          cargo test --locked --test linux_tun --no-run --message-format=json > test-artifacts.json
          python3 -c 'import json; a=[json.loads(x) for x in open("test-artifacts.json")]; print(next(x["executable"] for x in a if x.get("executable") and x.get("target",{}).get("name")=="linux_tun"))' > test-binary.txt
      - name: Test real TUN inside disposable namespace
        shell: bash
        run: |
          set -euo pipefail
          sudo ip netns add protun-next-ci
          trap 'sudo ip netns del protun-next-ci' EXIT
          sudo ip netns exec protun-next-ci env PROTUN_NEXT_NETNS_TEST=1 "$(cat test-binary.txt)" --ignored --nocapture --test-threads=1
