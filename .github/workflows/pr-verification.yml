name: Publish PR verification status
on:
  workflow_run:
    workflows: [verification, security-erasure]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write
jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python scripts/finish-automation.py pr-verification
        env:
          GH_TOKEN: ${{ github.token }}
