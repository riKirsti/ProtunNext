name: Publish PR verification status
on:
  workflow_run:
    workflows: [verification, security-erasure]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write
jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/finish-automation.py pr-verification
        env:
          GH_TOKEN: ${{ github.token }}
