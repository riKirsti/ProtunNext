name: worker-next-experiments
on:
  push:
    branches: [performance/worker-next]
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', 'experiments/next/**', '.github/workflows/worker-next.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: worker-next-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        replicate: ${{ fromJSON(github.event_name == 'push' && '[1]' || '[1,2,3]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build frozen-peer baseline and candidate probes
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/next/prepare.py
          mkdir -p target/next/bin target/next/profile-bin target/next/results
          export CARGO_TARGET_DIR="$PWD/target/next/cargo"
          for name in baseline gro candidate; do
            source="$(python3 -c "import json; print(json.load(open('target/next/builds.json'))['$name']['path'])")"
            cargo build --locked --release --no-default-features --features unix --bin next-probe --manifest-path "$source/Cargo.toml" >"target/next/results/build-$name.log" 2>&1
            cp target/next/cargo/release/next-probe "target/next/bin/$name"
          done
          cargo test --locked --lib --no-default-features --features unix >target/next/results/unit.log 2>&1
          uname -a >target/next/results/hardware.txt
          lscpu >>target/next/results/hardware.txt
      - name: Balanced isolated-process screening
        env:
          ROUNDS: ${{ github.event_name == 'push' && '2' || '6' }}
        run: sudo python3 experiments/next/run.py --rounds "$ROUNDS"
      - name: Build separate profiling probes
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$PWD/target/next/profile-cargo"
          export RUSTFLAGS='-Cforce-frame-pointers=yes -Cdebuginfo=1'
          for name in baseline candidate; do
            source="$(python3 -c "import json; print(json.load(open('target/next/builds.json'))['$name']['path'])")"
            cargo build --locked --release --no-default-features --features unix --bin next-probe --manifest-path "$source/Cargo.toml" >"target/next/results/profile-build-$name.log" 2>&1
            cp target/next/profile-cargo/release/next-probe "target/next/profile-bin/$name"
            objdump -Cd "target/next/profile-bin/$name" >"target/next/results/assembly-$name.txt"
          done
      - name: Profile client-only processes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic
          for candidate in /usr/lib/linux-tools/*/perf; do
            if [ -x "$candidate" ]; then perf_bin="$candidate"; break; fi
          done
          test -n "${perf_bin:-}"
          sudo sysctl kernel.perf_event_paranoid=-1
          sudo env NEXT_PERF="$perf_bin" python3 experiments/next/run.py --profile-only
      - name: Make owned measurement files readable by the artifact uploader
        if: always()
        run: |
          if [ -d target/next/results ]; then
            sudo chown -R "$(id -u):$(id -g)" target/next/results
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-next-${{ matrix.os }}-${{ matrix.replicate }}
          path: target/next/results/
