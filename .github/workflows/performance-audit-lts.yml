name: packet-erasure-actual-lts
on:
  push:
    branches: [performance/worker-next]
    paths:
      - 'experiments/audit/lts.py'
      - 'experiments/audit/run.py'
      - 'experiments/audit/prepare.py'
      - 'experiments/audit/worker_probe.rs'
      - 'experiments/audit/analyze.py'
      - '.github/workflows/performance-audit-lts.yml'
      - 'src/packet.rs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  lts:
    strategy:
      fail-fast: false
      matrix:
        kernel: [6.12.115, 6.18.60]
        replicate: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@1.99.1
        with: {targets: x86_64-unknown-linux-musl}
      - uses: actions/cache/restore@v4
        with:
          path: target/lts-kernels/${{ matrix.kernel }}/
          key: lts-kernel-${{ runner.arch }}-${{ matrix.kernel }}-${{ hashFiles('scripts/test-linux-lts.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 busybox-static musl-tools flex bison libelf-dev libssl-dev bc cpio
      - name: Build missing supported kernel and run functional checks
        shell: bash
        run: |
          if [ ! -s target/lts-kernels/${{ matrix.kernel }}/bzImage ]; then
            bash scripts/test-linux-lts.sh '${{ matrix.kernel }}'
          fi
      - name: Build isolated baseline and candidate with a fixed peer
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/audit/prepare.py
          mkdir -p target/erasure-audit/bin
          { rustc -vV; cargo -vV; printf 'profile=release thin-LTO codegen-units=1 panic=abort\nRUSTFLAGS=%s\n' "${RUSTFLAGS-}"; } > target/erasure-audit/toolchain.txt
          export CC_x86_64_unknown_linux_musl=musl-gcc
          for name in main erase; do
            export CARGO_TARGET_DIR="$PWD/target/erasure-audit/cargo-$name"
            export NEXT_BUILD_ID="$(python3 -c "import json; print(json.load(open('target/erasure-audit/builds.json'))['$name']['effective_sources_sha256'])")"
            source="$(python3 -c "import json; print(json.load(open('target/erasure-audit/builds.json'))['$name']['path'])")"
            if [ "$name" = erase ]; then
              cargo test --locked --lib --no-default-features --features unix --manifest-path "$source/Cargo.toml" > target/erasure-audit/probe-regressions.log 2>&1
            fi
            cargo build --locked --release --target x86_64-unknown-linux-musl --no-default-features --features unix --bin erasure-probe --manifest-path "$source/Cargo.toml" > "target/erasure-audit/build-$name.log" 2>&1
            cp "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release/erasure-probe" "target/erasure-audit/bin/$name"
          done
      - name: A/A controls and ABBA comparison on the actual supported kernel
        run: sudo python3 experiments/audit/lts.py '${{ matrix.kernel }}'
      - name: Publish validity separately from execution success
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" target/erasure-audit
          file=target/erasure-audit/results/${{ matrix.kernel }}/summary.md
          if [ -f "$file" ]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erasure-${{ matrix.kernel }}-${{ matrix.replicate }}
          path: |
            target/erasure-audit/results/
            target/erasure-audit/builds.json
            target/erasure-audit/toolchain.txt
            target/erasure-audit/*.log
