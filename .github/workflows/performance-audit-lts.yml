name: packet-erasure-actual-lts
on:
  workflow_dispatch:
    inputs:
      baseline:
        type: string
        default: ae9c9e86da8509261812813c9438e7ea625e19f5
        description: Baseline commit (default is merged PR 3)
permissions: {contents: read}
jobs:
  lts:
    strategy:
      fail-fast: false
      matrix:
        kernel: [6.12.115, 6.18.60]
        replicate: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@1.99.1
        with: {targets: x86_64-unknown-linux-musl}
      - uses: actions/cache/restore@v4
        with:
          path: target/lts-kernels/${{ matrix.kernel }}/
          key: lts-kernel-${{ runner.arch }}-${{ matrix.kernel }}-${{ hashFiles('scripts/test-linux-lts.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 busybox-static musl-tools flex bison libelf-dev libssl-dev bc cpio
      - name: Build missing supported kernel and run functional checks
        shell: bash
        run: |
          if [ ! -s target/lts-kernels/${{ matrix.kernel }}/bzImage ]; then
            bash scripts/test-linux-lts.sh '${{ matrix.kernel }}'
          fi
      - name: Build isolated baseline and candidate with a fixed baseline peer
        env:
          BASELINE: ${{ inputs.baseline }}
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: bash experiments/audit/build.sh x86_64-unknown-linux-musl
      - name: A/A controls and ABBA comparison on the actual supported kernel
        run: sudo python3 experiments/audit/lts.py '${{ matrix.kernel }}'
      - name: Publish validity separately from execution success
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" target/erasure-audit
          file=target/erasure-audit/results/${{ matrix.kernel }}/summary.md
          if [ -f "$file" ]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erasure-${{ matrix.kernel }}-${{ matrix.replicate }}
          path: |
            target/erasure-audit/results/
            target/erasure-audit/builds.json
            target/erasure-audit/toolchain.txt
            target/erasure-audit/*.log
  native-arm64:
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Build isolated native variants
        env:
          BASELINE: ${{ inputs.baseline }}
        run: bash experiments/audit/build.sh aarch64-unknown-linux-gnu
      - name: Native ARM64 diagnostic (host kernel recorded, not LTS acceptance)
        run: sudo python3 experiments/audit/native.py
      - name: Publish native validity
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" target/erasure-audit
          file=target/erasure-audit/results/native/summary.md
          if [ -f "$file" ]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erasure-native-arm64-${{ matrix.replicate }}
          path: |
            target/erasure-audit/results/
            target/erasure-audit/builds.json
            target/erasure-audit/toolchain.txt
            target/erasure-audit/*.log
