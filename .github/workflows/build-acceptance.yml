name: build-acceptance
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        default: paced
        options: [paced, capacity, delay]
        description: Same-host build factors; matched load or unpaced capacity screen
permissions: {contents: read}
defaults:
  run:
    shell: bash
env:
  BASELINE: 83582248f3a8e153c6ee75d2846ef7c7064b6323
concurrency:
  group: build-acceptance-${{ github.ref }}-${{ inputs.scenario }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@1.99.1
        with: {components: llvm-tools-preview}
      - name: Check comparison provenance and erasure controls
        run: |
          python3 -m unittest discover -s experiments/download -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/audit -p 'test_*.py' -v
      - name: Build and interleave independent/combined client factors
        run: python3 experiments/build/accept.py '${{ inputs.scenario }}'
      - name: Retain complete and unsuccessful cohorts
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target/erasure-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ inputs.scenario }}-${{ matrix.os }}
          path: |
            target/erasure-audit/results/
            target/erasure-audit/matrix/
            target/erasure-audit/pgo-*/
            target/erasure-audit/builds.json
            target/erasure-audit/toolchain.txt
            target/erasure-audit/*.log
