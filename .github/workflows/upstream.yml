name: Upstream release monitor
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check now without writing issues, merging or publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: upstream-release-monitor
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      update: ${{ steps.monitor.outputs.update }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - id: monitor
        run: python scripts/check-upstream.py
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
  propose:
    needs: check
    if: needs.check.outputs.update != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      patch: ${{ steps.proposal.outputs.patch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-opencode
      - id: proposal
        env:
          UPDATE: ${{ needs.check.outputs.update }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/hosted-upstream.py propose
          if test -s "$RUNNER_TEMP/upstream-draft/proposal.patch"; then
            echo 'patch=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.proposal.outputs.patch == 'true'
        with:
          name: upstream-proposal
          path: ${{ runner.temp }}/upstream-draft/
          retention-days: 3
          if-no-files-found: error
  draft:
    needs: [check, propose]
    if: needs.propose.outputs.patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-proposal
          path: ${{ runner.temp }}/upstream-draft/
      - run: python scripts/hosted-upstream.py publish
        env:
          UPDATE: ${{ needs.check.outputs.update }}
          GH_TOKEN: ${{ github.token }}
  complete:
    needs: [check, propose, draft]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.propose.result == 'success' || needs.propose.result == 'skipped') &&
      (needs.draft.result == 'success' || needs.draft.result == 'skipped') &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    concurrency:
      group: protunnext-automated-merge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python scripts/finish-automation.py
        env:
          UPDATE: ${{ needs.check.outputs.update }}
          GH_TOKEN: ${{ github.token }}
