name: download-performance
on:
  workflow_dispatch:
    inputs:
      baseline:
        type: string
        default: f7bf03f5b4dc3981eaadedbf3a7841c5ed5ee5c1
        description: Immutable baseline commit (merged PR 4)
      profiles_only:
        type: boolean
        default: false
        description: Run separate native diagnostics without repeating download matrices
      kernel:
        type: choice
        default: both
        options: [both, '6.12.115', '6.18.60']
        description: Supported kernel selection (specific kernel skips native jobs)
      block:
        type: string
        default: ''
        description: Optional workload block for a focused retest
      tun_mode:
        type: choice
        default: raw
        options: [raw, compare, vnet]
        description: Raw control or raw baseline versus negotiated receive coalescing
      client_cores:
        type: choice
        default: '1'
        options: ['1', '2']
        description: Same allowed client CPUs for baseline and candidate
      parallel_receive:
        type: boolean
        default: false
        description: Require actual candidate parallel authentication (two client CPUs)
permissions: {contents: read}
concurrency:
  group: download-${{ github.ref }}-${{ inputs.profiles_only }}-${{ inputs.kernel }}-${{ inputs.block }}-${{ inputs.tun_mode }}-${{ inputs.client_cores }}-${{ inputs.parallel_receive }}
  cancel-in-progress: true
jobs:
  lts:
    if: ${{ !inputs.profiles_only }}
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(inputs.kernel == '6.12.115' && '["6.12.115"]' || inputs.kernel == '6.18.60' && '["6.18.60"]' || '["6.12.115","6.18.60"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@1.99.1
        with: {targets: x86_64-unknown-linux-musl}
      - uses: actions/cache/restore@v4
        with:
          path: target/lts-kernels/${{ matrix.kernel }}/
          key: lts-kernel-${{ runner.arch }}-${{ matrix.kernel }}-${{ hashFiles('scripts/test-linux-lts.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 busybox-static musl-tools flex bison libelf-dev libssl-dev bc cpio
      - name: Build missing supported kernel and check functionality
        run: |
          if [ ! -s target/lts-kernels/${{ matrix.kernel }}/bzImage ]; then
            bash scripts/test-linux-lts.sh '${{ matrix.kernel }}'
          fi
      - name: Build normal-release isolated variants and fixed auxiliaries
        env:
          BASELINE: ${{ inputs.baseline }}
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: bash experiments/audit/build.sh x86_64-unknown-linux-musl
      - name: Real inner TCP downloads on supported kernel
        env:
          NEXT_DOWNLOAD_BLOCK: ${{ inputs.block }}
          NEXT_DOWNLOAD_TUN_MODE: ${{ inputs.tun_mode || 'raw' }}
          NEXT_DOWNLOAD_CLIENT_CORES: ${{ inputs.client_cores || '1' }}
          NEXT_DOWNLOAD_PARALLEL: ${{ inputs.parallel_receive && '1' || '0' }}
        run: sudo env "NEXT_DOWNLOAD_BLOCK=$NEXT_DOWNLOAD_BLOCK" "NEXT_DOWNLOAD_TUN_MODE=$NEXT_DOWNLOAD_TUN_MODE" "NEXT_DOWNLOAD_CLIENT_CORES=$NEXT_DOWNLOAD_CLIENT_CORES" "NEXT_DOWNLOAD_PARALLEL=$NEXT_DOWNLOAD_PARALLEL" python3 experiments/audit/lts.py '${{ matrix.kernel }}' --download
      - name: Publish results including failures and inconclusive cells
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" target/erasure-audit
          file=target/erasure-audit/results/download/${{ matrix.kernel }}/summary.md
          if [ -f "$file" ]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-${{ matrix.kernel }}
          path: |
            target/erasure-audit/results/
            target/erasure-audit/builds.json
            target/erasure-audit/toolchain.txt
            target/erasure-audit/*.log
  native:
    if: ${{ inputs.kernel == 'both' || inputs.kernel == '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Validate analyzer negative controls
        run: python3 -m unittest discover -s experiments/download -p 'test_*.py' -v
      - name: Build normal-release diagnostic variants
        if: ${{ !inputs.profiles_only }}
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          bash experiments/audit/build.sh "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Native downloads (actual host kernel recorded, not LTS acceptance)
        if: ${{ !inputs.profiles_only }}
        env:
          NEXT_DOWNLOAD_BLOCK: ${{ inputs.block }}
          NEXT_DOWNLOAD_TUN_MODE: ${{ inputs.tun_mode || 'raw' }}
          NEXT_DOWNLOAD_CLIENT_CORES: ${{ inputs.client_cores || '1' }}
          NEXT_DOWNLOAD_PARALLEL: ${{ inputs.parallel_receive && '1' || '0' }}
        run: sudo env "NEXT_DOWNLOAD_BLOCK=$NEXT_DOWNLOAD_BLOCK" "NEXT_DOWNLOAD_TUN_MODE=$NEXT_DOWNLOAD_TUN_MODE" "NEXT_DOWNLOAD_CLIENT_CORES=$NEXT_DOWNLOAD_CLIENT_CORES" "NEXT_DOWNLOAD_PARALLEL=$NEXT_DOWNLOAD_PARALLEL" python3 experiments/audit/native.py --download
      - name: Install profiler
        run: |
          sudo apt-get update
          # The generic metapackage can temporarily reference an unpublished
          # ABI on ARM64 mirrors. Select an actually available tools package.
          package=$(apt-cache dumpavail | awk '/^Package: linux-tools-[0-9].*-generic$/ {print $2}' | sort -Vu | tail -1)
          test -n "$package"
          sudo apt-get install -y --no-install-recommends "$package"
      - name: Profile a separate frame-pointer build
        env:
          BASELINE: ${{ inputs.baseline }}
          RUSTFLAGS: -C force-frame-pointers=yes
          CARGO_PROFILE_RELEASE_DEBUG: '1'
          NEXT_DOWNLOAD_CLIENT_CORES: ${{ inputs.client_cores || '1' }}
          NEXT_DOWNLOAD_TUN_MODE: ${{ inputs.tun_mode || 'raw' }}
        run: |
          bash experiments/audit/build.sh "$(rustc -vV | sed -n 's/^host: //p')"
          export PATH="$(dirname "$(find /usr/lib -path '*linux-tools*' -name perf -type f | head -1)"):$PATH"
          if [ "$NEXT_DOWNLOAD_TUN_MODE" = vnet ]; then
            sudo env "PATH=$PATH" python3 experiments/download/profile.py --variant main --tun-mode vnet --client-cores "$NEXT_DOWNLOAD_CLIENT_CORES"
            sudo env "PATH=$PATH" python3 experiments/download/profile.py --variant erase --tun-mode vnet --client-cores "$NEXT_DOWNLOAD_CLIENT_CORES"
            sudo env "PATH=$PATH" python3 experiments/download/profile.py --system --variant main --tun-mode vnet --client-cores "$NEXT_DOWNLOAD_CLIENT_CORES"
            sudo env "PATH=$PATH" python3 experiments/download/profile.py --system --variant erase --tun-mode vnet --client-cores "$NEXT_DOWNLOAD_CLIENT_CORES"
          elif [ "$NEXT_DOWNLOAD_TUN_MODE" = compare ]; then
            sudo env "PATH=$PATH" python3 experiments/download/profile.py --variant main --tun-mode raw
            sudo env "PATH=$PATH" python3 experiments/download/profile.py --variant erase --tun-mode vnet
            sudo env "PATH=$PATH" python3 experiments/download/profile.py --system --variant main --tun-mode raw
            sudo env "PATH=$PATH" python3 experiments/download/profile.py --system --variant erase --tun-mode vnet
          else
            sudo env "PATH=$PATH" python3 experiments/download/profile.py
            sudo env "PATH=$PATH" python3 experiments/download/profile.py --system
          fi
      - name: Make root-owned perf data readable for artifact retention
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target/erasure-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-${{ matrix.os }}
          path: |
            target/erasure-audit/results/
            target/erasure-audit/builds.json
            target/erasure-audit/toolchain.txt
            target/erasure-audit/*.log
            target/erasure-audit/bin/
