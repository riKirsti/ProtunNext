[package]
name = "stage5-crypto-screen"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ring = "=0.17.14"
chacha20poly1305 = { version = "=0.10.1", default-features = false }
chacha11 = { package = "chacha20poly1305", version = "=0.11.0", default-features = false, features = ["zeroize"] }
aws-lc-rs = { version = "=1.19.0", default-features = false, features = ["alloc", "non-fips", "prebuilt-nasm"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
