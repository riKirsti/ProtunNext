[package]
name = "ktls-next-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
libc = "0.2"
zeroize = "1"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
